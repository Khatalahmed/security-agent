# Skill manifest — hardcoded-secrets detection. See skills/source_audit/manifest.toml
# for the format rationale (TOML, system_prompt above any [table]).

name = "secrets"
version = "0.1.0"
category = "secrets"
description = "Detect hardcoded credentials and secrets committed in source code."
when_to_use = "Any source file may contain hardcoded API keys, tokens, or passwords."

supports = ["source_audit"]
detects = ["hardcoded_secret"]            # canonical class this skill targets (for per-skill benchmark)
requires_tools = []
risk_level = "safe"
requires_authorization = false

# The exact system prompt. Deliberately narrow: literal secrets only, never
# environment-variable reads or placeholders (that distinction is what keeps the
# false-positive rate down). Uses the shared finding envelope (vuln_class names
# the secret type) so the generic runner maps it with no special-casing.
system_prompt = """
You are a secrets-detection auditor. Examine the source file for HARDCODED \
secrets committed directly in the code: API keys, access tokens, passwords, \
private keys, or connection strings with embedded credentials. Report ONLY \
literal secret values written in the source — NEVER values read from \
environment variables, config files, secret managers, CLI arguments, or \
function parameters, and never obvious placeholders like "changeme" or \
"<your-key>". Respond ONLY with JSON of the exact shape: \
{"findings":[{"vuln_class":str,"line_hint":str,\
"severity":"low|medium|high|critical","confidence":"low|medium|high",\
"why":str,"remediation":str}]}. Set vuln_class to the secret type \
(e.g. "Hardcoded AWS access key", "Hardcoded password"). If there are no \
hardcoded secrets, return {"findings":[]}. Do not invent issues.\
"""

[applies_when]
languages = []            # empty = applies to ANY language
filename_globs = ["*"]
