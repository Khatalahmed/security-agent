name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, zero runtime deps)
        run: pip install -e .
      - name: Run test suite
        run: python tests/test_spine.py
      - name: Benchmark self-test (mock, no model needed)
        run: |
          python -m evaluation.benchmark --mock
          python -m evaluation.benchmark --per-skill --mock
